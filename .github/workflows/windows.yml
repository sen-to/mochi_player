name: Windows CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep CI aligned with the SDK selected by FVM in .fvmrc.
          flutter-version: 3.47.2
          cache: true

      - name: Show Flutter environment
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter compact

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload Windows application
        uses: actions/upload-artifact@v7
        with:
          name: mochi-player-windows-x64
          # upload-artifact packages this directory into a single zip, whose
          # root holds the executable, DLLs and data/ folder. Zipping it here
          # as well produced a zip nested inside the artifact's own zip.
          # A missing or empty release directory still fails the job.
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
