name: Windows CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read the Flutter version from .fvmrc
        id: fvmrc
        shell: pwsh
        run: |
          $version = (Get-Content .fvmrc -Raw | ConvertFrom-Json).flutter
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not read the Flutter version from .fvmrc"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install the pinned Flutter main commit
        shell: pwsh
        run: |
          $sdkPath = Join-Path $env:RUNNER_TEMP "flutter-sdk"
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git $sdkPath
          git -C $sdkPath checkout ${{ steps.fvmrc.outputs.version }}
          if ($LASTEXITCODE -ne 0) { throw "Flutter checkout failed" }
          "$sdkPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$sdkPath\bin\flutter.bat" --version
          if ($LASTEXITCODE -ne 0) { throw "Flutter setup failed" }

      - name: Show Flutter environment
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Check localization resources
        run: dart run tool/check_l10n.dart

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter compact

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload Windows application
        uses: actions/upload-artifact@v7
        with:
          name: mochi-player-windows-x64
          # upload-artifact packages this directory into a single zip, whose
          # root holds the executable, DLLs and data/ folder. Zipping it here
          # as well produced a zip nested inside the artifact's own zip.
          # A missing or empty release directory still fails the job.
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
